name: Build FF GUARDIAN 10.0.1 Core Alpha Independent Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify stable Engine10 architecture
        shell: powershell
        run: |
          $required = @(
            "FFGuardian.App/Engine10/FFGuardianEngine10.cs",
            "FFGuardian.App/Engine10/IndependentScanner10.cs",
            "FFGuardian.App/Engine10/SignatureDatabase10.cs",
            "FFGuardian.App/AuthenticodeVerifier100.cs",
            "FFGuardian.App/Engine10/PersistenceAudit10.cs",
            "FFGuardian.App/Engine10/ServiceAudit10.cs",
            "FFGuardian.App/Engine10/ScheduledTaskAudit10.cs",
            "FFGuardian.App/Engine10/QuarantineStore10.cs",
            "FFGuardian.App/Engine10/RemediationEngine10.cs",
            "FFGuardian.App/Engine10/RollbackManager10.cs",
            "FFGuardian.App/Engine10/SecureUpdater10.cs",
            "FFGuardian.App/Engine10/EngineContracts10.cs",
            "FFGuardian.App/IndependentSecurityEngine100.cs",
            "FFGuardian.App/IndependentMainForm100.cs",
            "FFGuardian.App/IndependentProtectionContext100.cs",
            "FFGuardian.App/Program.cs",
            "FFGuardian.App/FFGuardian.App.csproj"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Modulo richiesto non trovato: $file" }
          }

          $program = Get-Content "FFGuardian.App/Program.cs" -Raw
          $project = Get-Content "FFGuardian.App/FFGuardian.App.csproj" -Raw
          $orchestrator = Get-Content "FFGuardian.App/Engine10/FFGuardianEngine10.cs" -Raw
          $adapter = Get-Content "FFGuardian.App/IndependentSecurityEngine100.cs" -Raw
          $engineFiles = Get-ChildItem "FFGuardian.App/Engine10" -Filter *.cs |
            ForEach-Object { Get-Content $_.FullName -Raw }
          $independentSource = $engineFiles -join "`n"
          $independentSource += Get-Content "FFGuardian.App/AuthenticodeVerifier100.cs" -Raw
          $independentSource += $adapter
          $independentSource += Get-Content "FFGuardian.App/IndependentMainForm100.cs" -Raw
          $independentSource += Get-Content "FFGuardian.App/IndependentProtectionContext100.cs" -Raw

          if ($program -notmatch "IndependentProtectionContext100") { throw "Contesto indipendente non collegato" }
          if (($program + $independentSource) -match "MpCmdRun|Start-MpScan|DefenderService") { throw "Rilevata dipendenza da Microsoft Defender" }
          if ($adapter -notmatch "FFGuardianEngine10") { throw "Interfaccia non collegata all'orchestratore" }
          if ($orchestrator -notmatch "SemaphoreSlim") { throw "Blocco operativo unico mancante" }
          if ($independentSource -notmatch "SHA256") { throw "Calcolo SHA-256 mancante" }
          if ($independentSource -notmatch "WinVerifyTrust") { throw "Verifica Authenticode nativa mancante" }
          if ($project -notmatch '<FileVersion>10.0.1.0</FileVersion>') { throw "Versione progetto non allineata" }
          if ($project -notmatch 'Compile Remove="AutonomousProtectionContext.cs"') { throw "Contesto Defender storico non escluso" }

      - name: Restore application
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj

      - name: Compile application with warnings as errors
        run: dotnet build FFGuardian.App/FFGuardian.App.csproj -c Release --no-restore -warnaserror

      - name: Publish Windows x64 executable
        run: dotnet publish FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verify executable metadata
        shell: powershell
        run: |
          $exe = "publish/FFGuardian.exe"
          if (!(Test-Path $exe)) { throw "FFGuardian.exe non trovato" }
          if ((Get-Item $exe).Length -lt 20MB) { throw "FFGuardian.exe troppo piccolo o incompleto" }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if ($info.FileVersion -ne "10.0.1.0") { throw "Versione EXE errata: $($info.FileVersion)" }
          if ($info.ProductName -notmatch "Independent Security Engine") { throw "Metadati prodotto errati: $($info.ProductName)" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FFGuardianSetup.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer/Output/FFGuardianSetup-10.0.1-Core-Alpha-Independent.exe"
          if (!(Test-Path $installer)) { throw "Installer 10.0.1 non trovato" }
          if ((Get-Item $installer).Length -lt 20MB) { throw "Installer 10.0.1 troppo piccolo o incompleto" }

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath FF-GUARDIAN-10.0.1-CORE-ALPHA-INDEPENDENT-PORTABLE.zip -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-10.0.1-CORE-ALPHA-INDEPENDENT-INSTALLER
          path: installer/Output/FFGuardianSetup-10.0.1-Core-Alpha-Independent.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-10.0.1-CORE-ALPHA-INDEPENDENT-PORTABLE
          path: FF-GUARDIAN-10.0.1-CORE-ALPHA-INDEPENDENT-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
