name: Build FF GUARDIAN 9.2 Triple-Checked Professional Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pass 1 - Verify source architecture
        shell: powershell
        run: |
          $required = @(
            "FFGuardian.App/ProfessionalMainForm92.cs",
            "FFGuardian.App/SecurityOperationGate92.cs",
            "FFGuardian.App/AutonomousProtectionContext.cs",
            "FFGuardian.App/Program.cs",
            "FFGuardian.App/StabilityCoordinator82.cs",
            "FFGuardian.App/FFGuardian.App.csproj"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "File richiesto non trovato: $file" }
          }

          $program = Get-Content "FFGuardian.App/Program.cs" -Raw
          $context = Get-Content "FFGuardian.App/AutonomousProtectionContext.cs" -Raw
          $project = Get-Content "FFGuardian.App/FFGuardian.App.csproj" -Raw
          $form = Get-Content "FFGuardian.App/ProfessionalMainForm92.cs" -Raw

          if ($program -match "AutonomousSecurityEngine\.Start|StabilityCoordinator82\.Start") { throw "Rilevato motore o coordinatore storico" }
          if ($context -notmatch "ProfessionalMainForm92") { throw "Interfaccia 9.2 non collegata" }
          if ($context -notmatch "SecurityOperationGate92") { throw "Coordinamento operazioni mancante nel tray" }
          if ($form -notmatch "SecurityOperationGate92") { throw "Coordinamento operazioni mancante nella UI" }
          if ($project -notmatch 'Compile Remove="ProfessionalMainForm91.cs"') { throw "Interfaccia 9.1 non esclusa" }
          if ($project -notmatch 'Compile Remove="AutonomousSecurityEngine.cs"') { throw "Motore storico non escluso" }

      - name: Restore dependencies
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj

      - name: Pass 2 - Compile with warnings as errors
        run: dotnet build FFGuardian.App/FFGuardian.App.csproj -c Release --no-restore -warnaserror

      - name: Pass 3 - Publish Windows x64 executable
        run: dotnet publish FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verify executable metadata
        shell: powershell
        run: |
          $exe = "publish/FFGuardian.exe"
          if (!(Test-Path $exe)) { throw "FFGuardian.exe non trovato" }
          if ((Get-Item $exe).Length -lt 20MB) { throw "FFGuardian.exe troppo piccolo o incompleto" }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if ($info.FileVersion -ne "9.2.0.0") { throw "Versione EXE errata: $($info.FileVersion)" }
          if ($info.ProductName -notmatch "Triple-Checked Professional Edition") { throw "Metadati prodotto errati: $($info.ProductName)" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FFGuardianSetup.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer/Output/FFGuardianSetup-9.2-Triple-Checked-Professional-Edition.exe"
          if (!(Test-Path $installer)) { throw "Installer 9.2 non trovato" }
          if ((Get-Item $installer).Length -lt 20MB) { throw "Installer 9.2 troppo piccolo o incompleto" }

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath FF-GUARDIAN-9.2-TRIPLE-CHECKED-PROFESSIONAL-PORTABLE.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-9.2-TRIPLE-CHECKED-PROFESSIONAL-INSTALLER
          path: installer/Output/FFGuardianSetup-9.2-Triple-Checked-Professional-Edition.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-9.2-TRIPLE-CHECKED-PROFESSIONAL-PORTABLE
          path: FF-GUARDIAN-9.2-TRIPLE-CHECKED-PROFESSIONAL-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
