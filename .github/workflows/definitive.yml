name: Verify FF GUARDIAN Engine10 Definitive

on:
  push:
    branches: [ engine10-definitive ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify required Engine10 files
        shell: powershell
        run: |
          $required = @(
            "FFGuardian.App/Engine10/FFGuardianEngine10.cs",
            "FFGuardian.App/Engine10/IndependentScanner10.cs",
            "FFGuardian.App/Engine10/SignatureDatabase10.cs",
            "FFGuardian.App/AuthenticodeVerifier100.cs",
            "FFGuardian.App/Engine10/PersistenceAudit10.cs",
            "FFGuardian.App/Engine10/ServiceAudit10.cs",
            "FFGuardian.App/Engine10/ScheduledTaskAudit10.cs",
            "FFGuardian.App/Engine10/QuarantineStore10.cs",
            "FFGuardian.App/Engine10/RemediationEngine10.cs",
            "FFGuardian.App/Engine10/RollbackManager10.cs",
            "FFGuardian.App/Engine10/SecureUpdater10.cs",
            "FFGuardian.App/Engine10/EngineContracts10.cs",
            "FFGuardian.App/IndependentSecurityEngine100.cs",
            "FFGuardian.App/IndependentProtectionContext100.cs",
            "FFGuardian.App/Program.cs",
            "FFGuardian.App/FFGuardian.App.csproj",
            "FFGuardian.Engine10.SmokeTests/FFGuardian.Engine10.SmokeTests.csproj",
            "FFGuardian.Engine10.SmokeTests/Program.cs"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "File richiesto non trovato: $file"
            }
          }

      - name: Restore application
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj -r win-x64

      - name: Build application
        run: dotnet build FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --no-restore -warnaserror

      - name: Restore smoke tests
        run: dotnet restore FFGuardian.Engine10.SmokeTests/FFGuardian.Engine10.SmokeTests.csproj -r win-x64

      - name: Build smoke tests
        run: dotnet build FFGuardian.Engine10.SmokeTests/FFGuardian.Engine10.SmokeTests.csproj -c Release -r win-x64 --no-restore -warnaserror

      - name: Run Engine10 smoke tests
        run: dotnet run --project FFGuardian.Engine10.SmokeTests/FFGuardian.Engine10.SmokeTests.csproj -c Release -r win-x64 --no-build
