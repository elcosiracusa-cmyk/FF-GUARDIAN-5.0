name: Build FF GUARDIAN 10 Core Alpha Independent Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify independent architecture
        shell: powershell
        run: |
          $required = @(
            "FFGuardian.App/IndependentSecurityEngine100.cs",
            "FFGuardian.App/IndependentMainForm100.cs",
            "FFGuardian.App/IndependentProtectionContext100.cs",
            "FFGuardian.App/Program.cs",
            "FFGuardian.App/StabilityCoordinator82.cs",
            "FFGuardian.App/FFGuardian.App.csproj"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "File richiesto non trovato: $file" }
          }

          $program = Get-Content "FFGuardian.App/Program.cs" -Raw
          $engine = Get-Content "FFGuardian.App/IndependentSecurityEngine100.cs" -Raw
          $form = Get-Content "FFGuardian.App/IndependentMainForm100.cs" -Raw
          $context = Get-Content "FFGuardian.App/IndependentProtectionContext100.cs" -Raw
          $project = Get-Content "FFGuardian.App/FFGuardian.App.csproj" -Raw

          if ($program -notmatch "IndependentProtectionContext100") { throw "Contesto indipendente non collegato" }
          if ($program -match "AutonomousProtectionContext|DefenderService") { throw "Dipendenza Defender nel percorso di avvio" }
          if ($engine -match "DefenderService|MpCmdRun|Start-MpScan") { throw "Il motore indipendente richiama Defender" }
          if ($form -match "DefenderService|Microsoft Defender integrato") { throw "La UI indipendente richiama Defender" }
          if ($context -match "DefenderService|QuickScanAsync|UpdateAsync") { throw "Il tray indipendente richiama Defender" }
          if ($engine -notmatch "SHA256") { throw "Calcolo SHA-256 mancante" }
          if ($engine -notmatch "AuditStartupEntries") { throw "Analisi avvio automatico mancante" }
          if ($engine -notmatch "AuditServices") { throw "Analisi servizi mancante" }
          if ($engine -notmatch "AuditScheduledTasksAsync") { throw "Analisi attività pianificate mancante" }
          if ($project -notmatch 'Compile Remove="AutonomousProtectionContext.cs"') { throw "Contesto Defender storico non escluso" }
          if ($project -notmatch 'Compile Remove="ProfessionalMainForm92.cs"') { throw "Interfaccia 9.2 non esclusa" }

      - name: Restore dependencies
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj

      - name: Compile with warnings as errors
        run: dotnet build FFGuardian.App/FFGuardian.App.csproj -c Release --no-restore -warnaserror

      - name: Publish Windows x64 executable
        run: dotnet publish FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verify executable metadata
        shell: powershell
        run: |
          $exe = "publish/FFGuardian.exe"
          if (!(Test-Path $exe)) { throw "FFGuardian.exe non trovato" }
          if ((Get-Item $exe).Length -lt 20MB) { throw "FFGuardian.exe troppo piccolo o incompleto" }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if ($info.FileVersion -ne "10.0.0.0") { throw "Versione EXE errata: $($info.FileVersion)" }
          if ($info.ProductName -notmatch "Independent Security Engine") { throw "Metadati prodotto errati: $($info.ProductName)" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FFGuardianSetup.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer/Output/FFGuardianSetup-10.0-Core-Alpha-Independent.exe"
          if (!(Test-Path $installer)) { throw "Installer 10.0 non trovato" }
          if ((Get-Item $installer).Length -lt 20MB) { throw "Installer 10.0 troppo piccolo o incompleto" }

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath FF-GUARDIAN-10.0-CORE-ALPHA-INDEPENDENT-PORTABLE.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-10.0-CORE-ALPHA-INDEPENDENT-INSTALLER
          path: installer/Output/FFGuardianSetup-10.0-Core-Alpha-Independent.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-10.0-CORE-ALPHA-INDEPENDENT-PORTABLE
          path: FF-GUARDIAN-10.0-CORE-ALPHA-INDEPENDENT-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
