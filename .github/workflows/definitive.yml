name: Verify FF GUARDIAN Engine10 Definitive

on:
  push:
    branches: [ engine10-definitive ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify required Engine10 files
        shell: powershell
        run: |
          $required = @(
            "FFGuardian.App/Engine10/FFGuardianEngine10.cs",
            "FFGuardian.App/Engine10/FFGuardianEngine10.Rollback.cs",
            "FFGuardian.App/Engine10/FFGuardianEngine10.Update.cs",
            "FFGuardian.App/Engine10/AutonomousProtectionAgent10.cs",
            "FFGuardian.App/Engine10/IndependentScanner10.cs",
            "FFGuardian.App/Engine10/StaticContentAnalyzer10.cs",
            "FFGuardian.App/Engine10/SignatureDatabase10.cs",
            "FFGuardian.App/AuthenticodeVerifier100.cs",
            "FFGuardian.App/Engine10/AuditTargetInspector10.cs",
            "FFGuardian.App/Engine10/PersistenceAudit10.cs",
            "FFGuardian.App/Engine10/ServiceAudit10.cs",
            "FFGuardian.App/Engine10/ScheduledTaskAudit10.cs",
            "FFGuardian.App/Engine10/QuarantineStore10.cs",
            "FFGuardian.App/Engine10/RemediationEngine10.cs",
            "FFGuardian.App/Engine10/RollbackManager10.cs",
            "FFGuardian.App/Engine10/SecureUpdater10.cs",
            "FFGuardian.App/Engine10/EngineContracts10.cs",
            "FFGuardian.App/IndependentSecurityEngine100.cs",
            "FFGuardian.App/IndependentProtectionContext100.cs",
            "FFGuardian.App/Program.cs",
            "FFGuardian.App/FFGuardian.App.csproj",
            "FFGuardian.Engine10.SmokeTests/FFGuardian.Engine10.SmokeTests.csproj",
            "FFGuardian.Engine10.SmokeTests/Program.cs",
            "FFGuardian.Engine10.SmokeTests/AuditSmokeTests10.cs",
            "FFGuardian.Engine10.RemediationTests/FFGuardian.Engine10.RemediationTests.csproj",
            "FFGuardian.Engine10.RemediationTests/Program.cs",
            "FFGuardian.Engine10.UpdateTests/FFGuardian.Engine10.UpdateTests.csproj",
            "FFGuardian.Engine10.UpdateTests/Program.cs",
            "FFGuardian.Engine10.AgentTests/FFGuardian.Engine10.AgentTests.csproj",
            "FFGuardian.Engine10.AgentTests/Program.cs"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "File richiesto non trovato: $file"
            }
          }

      - name: Verify encrypted quarantine safeguards
        shell: powershell
        run: |
          $quarantine = Get-Content "FFGuardian.App/Engine10/QuarantineStore10.cs" -Raw
          $tests = Get-Content "FFGuardian.Engine10.SmokeTests/Program.cs" -Raw
          foreach ($requiredToken in @(
            "Aes.Create", "CipherMode.CBC", "HMACSHA256", "FixedTimeEquals",
            "ComputeSha256Async", "DecryptAndHashAsync", "metadata.hmac", "payload.ffgq"
          )) {
            if ($quarantine -notmatch [regex]::Escape($requiredToken)) {
              throw "Protezione quarantena mancante: $requiredToken"
            }
          }
          if ($tests -notmatch "tamperRejected") { throw "Test di manomissione quarantena mancante" }
          if ($tests -notmatch "SequenceEqual") { throw "Test di cifratura o ripristino esatto mancante" }

      - name: Verify remediation safeguards
        shell: powershell
        run: |
          $engine = Get-Content "FFGuardian.App/Engine10/RemediationEngine10.cs" -Raw
          $tests = Get-Content "FFGuardian.Engine10.RemediationTests/Program.cs" -Raw
          foreach ($requiredToken in @(
            "RequiresConfirmation", "BackupFileAsync", "DisableStartupFile",
            "ffguardian-disabled", "IsStartupFolderFile", "RollbackId"
          )) {
            if (($engine + $tests) -notmatch [regex]::Escape($requiredToken)) {
              throw "Protezione remediation mancante: $requiredToken"
            }
          }
          if ($tests -notmatch "confirmationBlocked") { throw "Test conferma obbligatoria mancante" }
          if ($tests -notmatch "externalBlocked") { throw "Test blocco percorso esterno mancante" }

      - name: Verify complete rollback safeguards
        shell: powershell
        run: |
          $rollback = Get-Content "FFGuardian.App/Engine10/RollbackManager10.cs" -Raw
          $orchestrator = Get-Content "FFGuardian.App/Engine10/FFGuardianEngine10.Rollback.cs" -Raw
          $tests = Get-Content "FFGuardian.Engine10.RemediationTests/Program.cs" -Raw
          $source = $rollback + $orchestrator + $tests
          foreach ($requiredToken in @(
            "BackupFileAsync", "RestoreFileAsync", "ComputeSha256Async",
            "BackupRegistryValueAsync", "RestoreRegistryValueAsync", "RegistryValueKind",
            "BackupServiceAsync", "RestoreServiceAsync", "CurrentControlSet\Services",
            "BackupScheduledTaskAsync", "RestoreScheduledTaskAsync", "schtasks.exe",
            "IntegritySha256", "GetRecordAsync", "confirmed"
          )) {
            if ($source -notmatch [regex]::Escape($requiredToken)) {
              throw "Protezione rollback mancante: $requiredToken"
            }
          }
          if ($tests -notmatch "original-value" -or $tests -notmatch "changed-value") { throw "Test rollback registro mancante" }
          if ($tests -notmatch "startupContent") { throw "Test rollback file esatto mancante" }

      - name: Verify secure update safeguards
        shell: powershell
        run: |
          $updater = Get-Content "FFGuardian.App/Engine10/SecureUpdater10.cs" -Raw
          $orchestrator = Get-Content "FFGuardian.App/Engine10/FFGuardianEngine10.Update.cs" -Raw
          $tests = Get-Content "FFGuardian.Engine10.UpdateTests/Program.cs" -Raw
          $source = $updater + $orchestrator + $tests
          foreach ($requiredToken in @(
            "UriSchemeHttps", "RSASignaturePadding.Pss", "ResponseHeadersRead",
            "targetVersion <= request.InstalledVersion", "RequireAuthenticode",
            "AuthenticodeVerifier100.Verify", "previous", "File.Move",
            "DownloadAndStageUpdateAsync", "downgrade", "badSignature"
          )) {
            if ($source -notmatch [regex]::Escape($requiredToken)) {
              throw "Protezione aggiornamenti mancante: $requiredToken"
            }
          }
          if ($tests -notmatch "http://updates.example.invalid") { throw "Test blocco HTTP mancante" }
          if ($tests -notmatch "PreviousVersionBackupPath") { throw "Test backup versione precedente mancante" }

      - name: Verify autonomous agent safeguards
        shell: powershell
        run: |
          $agent = Get-Content "FFGuardian.App/Engine10/AutonomousProtectionAgent10.cs" -Raw
          $context = Get-Content "FFGuardian.App/IndependentProtectionContext100.cs" -Raw
          $tests = Get-Content "FFGuardian.Engine10.AgentTests/Program.cs" -Raw
          $source = $agent + $context + $tests
          foreach ($requiredToken in @(
            "FileSystemWatcher", "Channel.CreateBounded", "DropOldest", "DuplicateWindow",
            "WaitForStableFileAsync", "ScanFileAsync", "AutonomousProtectionAgent10",
            "QueueFileForTest", "duplicateQueued", "File.Exists(suspicious)",
            "ThreatDetected", "Test.EICAR", "File.Exists(eicarPath)"
          )) {
            if ($source -notmatch [regex]::Escape($requiredToken)) {
              throw "Protezione agente autonoma mancante: $requiredToken"
            }
          }
          if ($agent -match "ExecuteQuarantineAsync") {
            throw "L'agente non deve applicare quarantena automatica"
          }
          if ($tests -notmatch "ThreatVerdict10.Suspicious or ThreatVerdict10.Malicious") {
            throw "Test comportamentale dello script sospetto mancante"
          }
          if ($tests -notmatch "eicarDetected.Task.WaitAsync") {
            throw "Test EICAR in tempo reale mancante"
          }
          Write-Host "Autonomous agent safeguards verified."

      - name: Restore application
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj -r win-x64

      - name: Build application
        run: dotnet build FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --no-restore -warnaserror

      - name: Restore smoke tests
        run: dotnet restore FFGuardian.Engine10.SmokeTests/FFGuardian.Engine10.SmokeTests.csproj -r win-x64

      - name: Build smoke tests
        run: dotnet build FFGuardian.Engine10.SmokeTests/FFGuardian.Engine10.SmokeTests.csproj -c Release -r win-x64 --no-restore -warnaserror

      - name: Run Engine10 smoke tests
        run: dotnet run --project FFGuardian.Engine10.SmokeTests/FFGuardian.Engine10.SmokeTests.csproj -c Release -r win-x64 --no-build

      - name: Restore remediation tests
        run: dotnet restore FFGuardian.Engine10.RemediationTests/FFGuardian.Engine10.RemediationTests.csproj -r win-x64

      - name: Build remediation tests
        run: dotnet build FFGuardian.Engine10.RemediationTests/FFGuardian.Engine10.RemediationTests.csproj -c Release -r win-x64 --no-restore -warnaserror

      - name: Run remediation tests
        run: dotnet run --project FFGuardian.Engine10.RemediationTests/FFGuardian.Engine10.RemediationTests.csproj -c Release -r win-x64 --no-build

      - name: Restore secure update tests
        run: dotnet restore FFGuardian.Engine10.UpdateTests/FFGuardian.Engine10.UpdateTests.csproj -r win-x64

      - name: Build secure update tests
        run: dotnet build FFGuardian.Engine10.UpdateTests/FFGuardian.Engine10.UpdateTests.csproj -c Release -r win-x64 --no-restore -warnaserror

      - name: Run secure update tests
        run: dotnet run --project FFGuardian.Engine10.UpdateTests/FFGuardian.Engine10.UpdateTests.csproj -c Release -r win-x64 --no-build

      - name: Restore autonomous agent tests
        run: dotnet restore FFGuardian.Engine10.AgentTests/FFGuardian.Engine10.AgentTests.csproj -r win-x64

      - name: Build autonomous agent tests
        run: dotnet build FFGuardian.Engine10.AgentTests/FFGuardian.Engine10.AgentTests.csproj -c Release -r win-x64 --no-restore -warnaserror

      - name: Run autonomous agent tests
        run: dotnet run --project FFGuardian.Engine10.AgentTests/FFGuardian.Engine10.AgentTests.csproj -c Release -r win-x64 --no-build
