name: Build FF GUARDIAN 8.3 Core Architecture Upgrade

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj
      - name: Build core architecture check
        run: dotnet build FFGuardian.App/FFGuardian.App.csproj -c Release --no-restore -warnaserror
      - name: Publish single EXE
        run: dotnet publish FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Verify published executable and version
        shell: powershell
        run: |
          $exe = "publish/FFGuardian.exe"
          if (!(Test-Path $exe)) { throw "FFGuardian.exe non trovato" }
          if ((Get-Item $exe).Length -lt 1MB) { throw "FFGuardian.exe non valido" }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe)).FileVersion
          if ($version -ne "8.3.0.0") { throw "Versione EXE errata: $version" }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FFGuardianSetup.iss'
      - name: Verify installer
        shell: powershell
        run: |
          if (!(Test-Path "installer/Output/FFGuardianSetup-8.3-Core-Architecture-Upgrade.exe")) { throw "Installer 8.3 non trovato" }
      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath FF-GUARDIAN-8.3-CORE-ARCHITECTURE-UPGRADE-PORTABLE.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-8.3-CORE-ARCHITECTURE-UPGRADE-INSTALLER
          path: installer/Output/FFGuardianSetup-8.3-Core-Architecture-Upgrade.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-8.3-CORE-ARCHITECTURE-UPGRADE-PORTABLE
          path: FF-GUARDIAN-8.3-CORE-ARCHITECTURE-UPGRADE-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
