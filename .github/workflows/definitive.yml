name: Build FF GUARDIAN 9.0 Professional Clean Architecture

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify clean architecture
        shell: powershell
        run: |
          $required = @(
            "FFGuardian.App/CleanMainForm90.cs",
            "FFGuardian.App/AutonomousProtectionContext.cs",
            "FFGuardian.App/Program.cs",
            "FFGuardian.App/StabilityCoordinator82.cs"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "File richiesto non trovato: $file" }
          }

          $program = Get-Content "FFGuardian.App/Program.cs" -Raw
          $context = Get-Content "FFGuardian.App/AutonomousProtectionContext.cs" -Raw
          $logger = Get-Content "FFGuardian.App/StabilityCoordinator82.cs" -Raw

          if ($program -match "StabilityCoordinator82\.Start") { throw "Il vecchio coordinatore grafico è ancora avviato" }
          if ($program -match "new MainForm") { throw "La vecchia MainForm è ancora nel percorso di avvio" }
          if ($context -notmatch "CleanMainForm90") { throw "La nuova interfaccia professionale non è collegata" }
          if ($context -match "SupportVisibilityPatch") { throw "Rilevata una patch grafica storica nel nuovo avvio" }
          if ($logger -match "System\.Windows\.Forms\.Timer") { throw "Il logger contiene ancora un timer grafico" }
          if ($logger -match "\.Apply\(") { throw "Il logger richiama ancora moduli grafici storici" }

      - name: Restore dependencies
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj

      - name: Build with warnings as errors
        run: dotnet build FFGuardian.App/FFGuardian.App.csproj -c Release --no-restore -warnaserror

      - name: Publish single executable
        run: dotnet publish FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verify executable
        shell: powershell
        run: |
          $exe = "publish/FFGuardian.exe"
          if (!(Test-Path $exe)) { throw "FFGuardian.exe non trovato" }
          if ((Get-Item $exe).Length -lt 20MB) { throw "FFGuardian.exe troppo piccolo o incompleto" }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))
          if ($info.FileVersion -ne "9.0.0.0") { throw "Versione EXE errata: $($info.FileVersion)" }
          if ($info.ProductName -notmatch "Professional Clean Architecture") { throw "Metadati prodotto errati: $($info.ProductName)" }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FFGuardianSetup.iss'

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer/Output/FFGuardianSetup-9.0-Professional-Clean-Architecture.exe"
          if (!(Test-Path $installer)) { throw "Installer 9.0 non trovato" }
          if ((Get-Item $installer).Length -lt 20MB) { throw "Installer 9.0 troppo piccolo o incompleto" }

      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath FF-GUARDIAN-9.0-PROFESSIONAL-CLEAN-PORTABLE.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-9.0-PROFESSIONAL-CLEAN-INSTALLER
          path: installer/Output/FFGuardianSetup-9.0-Professional-Clean-Architecture.exe
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-9.0-PROFESSIONAL-CLEAN-PORTABLE
          path: FF-GUARDIAN-9.0-PROFESSIONAL-CLEAN-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30
