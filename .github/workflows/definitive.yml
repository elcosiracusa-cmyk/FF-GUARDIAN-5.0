name: Build FF GUARDIAN 8.1 Advanced Settings

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single EXE
        run: dotnet publish FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FFGuardianSetup.iss'
      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath FF-GUARDIAN-8.1-ADVANCED-SETTINGS-PORTABLE.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-8.1-ADVANCED-SETTINGS-INSTALLER
          path: installer/Output/FFGuardianSetup-8.1-Advanced-Settings.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-8.1-ADVANCED-SETTINGS-PORTABLE
          path: FF-GUARDIAN-8.1-ADVANCED-SETTINGS-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30