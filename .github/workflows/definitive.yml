name: Build FF GUARDIAN 8.3.4 Full Bug and UI Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify audit source files
        shell: powershell
        run: |
          $required = @(
            "FFGuardian.App/FinalUiAudit834.cs",
            "FFGuardian.App/InterfaceRecovery831.cs",
            "FFGuardian.App/DefinitiveReports832.cs",
            "FFGuardian.App/CoreHealth83.cs"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "File richiesto non trovato: $file" }
          }
      - name: Restore dependencies
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj
      - name: Build full bug and UI audit check
        run: dotnet build FFGuardian.App/FFGuardian.App.csproj -c Release --no-restore -warnaserror
      - name: Publish single EXE
        run: dotnet publish FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Verify published executable and version
        shell: powershell
        run: |
          $exe = "publish/FFGuardian.exe"
          if (!(Test-Path $exe)) { throw "FFGuardian.exe non trovato" }
          if ((Get-Item $exe).Length -lt 1MB) { throw "FFGuardian.exe non valido" }
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe)).FileVersion
          if ($version -ne "8.3.4.0") { throw "Versione EXE errata: $version" }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\FFGuardianSetup.iss'
      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer/Output/FFGuardianSetup-8.3.4-Full-Bug-UI-Audit.exe"
          if (!(Test-Path $installer)) { throw "Installer 8.3.4 non trovato" }
          if ((Get-Item $installer).Length -lt 1MB) { throw "Installer 8.3.4 non valido" }
      - name: Create portable ZIP
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath FF-GUARDIAN-8.3.4-FULL-BUG-UI-AUDIT-PORTABLE.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-8.3.4-FULL-BUG-UI-AUDIT-INSTALLER
          path: installer/Output/FFGuardianSetup-8.3.4-Full-Bug-UI-Audit.exe
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-8.3.4-FULL-BUG-UI-AUDIT-PORTABLE
          path: FF-GUARDIAN-8.3.4-FULL-BUG-UI-AUDIT-PORTABLE.zip
          if-no-files-found: error
          retention-days: 30