name: FFGuardian QA Downloadable Package

on:
  push:
    branches: [qa/full-stabilization-20260804]
  pull_request:
    branches: [engine10-definitive]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffguardian-qa-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build and package FFGuardian win-x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Show environment
        shell: pwsh
        run: |
          dotnet --info
          Write-Host "Commit: $env:GITHUB_SHA"
          Write-Host "Ref: $env:GITHUB_REF"

      - name: Apply validated QA compatibility fixes
        shell: pwsh
        run: |
          $premiumUi = "FFGuardian.App/PremiumCommercialShell28.cs"
          $portableYara = "FFGuardian.App/Yara/YaraPortableManager29.cs"

          $premium = Get-Content $premiumUi -Raw
          $premium = $premium.Replace('tabs.Padding = Padding.Empty;', 'tabs.Padding = Point.Empty;')
          $premium = $premium.Replace('case Panel panel:',
            'case Panel panel when control is not TableLayoutPanel && control is not FlowLayoutPanel:')
          Set-Content $premiumUi -Value $premium -Encoding UTF8

          $yara = Get-Content $portableYara -Raw
          $oldJson = 'new JsonSerializerOptions { PropertyNameCaseInsensitive = true }'
          $newJson = 'new JsonSerializerOptions { PropertyNameCaseInsensitive = true, PropertyNamingPolicy = JsonNamingPolicy.SnakeCaseLower }'
          if (-not $yara.Contains($oldJson)) {
            throw "Configurazione JSON YARA attesa non trovata."
          }
          $yara = $yara.Replace($oldJson, $newJson)
          $yara = $yara.Replace('Path.GetFileName(asset.Name)', 'Path.GetFileName(asset.Name!)')
          Set-Content $portableYara -Value $yara -Encoding UTF8

      - name: Verify portable YARA source contract
        shell: pwsh
        run: |
          $source = Get-Content "FFGuardian.App/Yara/YaraPortableManager29.cs" -Raw
          $required = @(
            'Path.Combine("Engine", "Yara", "yara64.exe")',
            'Path.Combine("Engine", "Yara", "yara.exe")',
            'Path.Combine("Tools", "Yara", "yara64.exe")',
            'Path.Combine("Tools", "Yara", "yara.exe")',
            'AppContext.BaseDirectory',
            'UseShellExecute = false',
            'CreateNoWindow = true',
            'RedirectStandardOutput = true',
            'RedirectStandardError = true',
            'SHA256.HashDataAsync',
            'FFGuardian_Yara_Portable_SelfTest'
          )
          foreach ($item in $required) {
            if (-not $source.Contains($item)) {
              throw "Contratto YARA portable mancante: $item"
            }
          }

      - name: Restore application project
        shell: pwsh
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj --runtime win-x64

      - name: Build Release x64
        shell: pwsh
        run: >-
          dotnet build FFGuardian.App/FFGuardian.App.csproj
          --configuration Release
          --runtime win-x64
          --no-restore
          /warnaserror
          /p:NoWarn=SYSLIB1045%3BSYSLIB1054

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: >-
          dotnet publish FFGuardian.App/FFGuardian.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/win-x64
          /p:NoWarn=SYSLIB1045%3BSYSLIB1054

      - name: Verify published executable
        shell: pwsh
        run: |
          $required = @(
            "artifacts/publish/win-x64/FFGuardian.exe",
            "artifacts/publish/win-x64/FFGuardian.dll",
            "artifacts/publish/win-x64/FFGuardian.runtimeconfig.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "File obbligatorio mancante: $file" }
          }

      - name: Write package information
        shell: pwsh
        run: |
          $info = @"
          FFGuardian Ultimate Protection — QA package
          Commit: $env:GITHUB_SHA
          Build UTC: $([DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss"))
          Runtime: win-x64
          Framework: .NET 8 self-contained

          YARA portable:
          Lo stato ATTIVO richiede --version e il rilevamento di una regola innocua.
          I percorsi sono risolti da AppContext.BaseDirectory.
          INSTALLA YARA usa la release ufficiale VirusTotal/yara e verifica SHA-256.

          La build verifica compilazione e packaging. Il test runtime YARA richiede
          l'esecuzione su Windows con il binario presente o installato dall'app.
          "@
          Set-Content -Path "artifacts/publish/win-x64/BUILD-INFO.txt" -Value $info -Encoding UTF8

      - name: Create ZIP package
        shell: pwsh
        run: |
          $zip = "artifacts/FFGuardian-Ultimate-QA-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Set-Content -Path "artifacts/FFGuardian-Ultimate-QA-win-x64.sha256.txt" -Value "$hash  FFGuardian-Ultimate-QA-win-x64.zip" -Encoding ASCII

      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: FFGuardian-Ultimate-QA-win-x64
          path: |
            artifacts/FFGuardian-Ultimate-QA-win-x64.zip
            artifacts/FFGuardian-Ultimate-QA-win-x64.sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
