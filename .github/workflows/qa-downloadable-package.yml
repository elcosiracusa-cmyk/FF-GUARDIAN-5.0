name: FFGuardian QA Downloadable Package

on:
  push:
    branches: [qa/full-stabilization-20260804]
  pull_request:
    branches: [engine10-definitive]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffguardian-qa-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Build test and package FFGuardian win-x64
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Apply validated QA compatibility fixes
        shell: pwsh
        run: |
          $premiumUi = "FFGuardian.App/PremiumCommercialShell28.cs"
          $portableYara = "FFGuardian.App/Yara/YaraPortableManager29.cs"
          $yaraServices = "FFGuardian.App/Yara/YaraServices27.cs"

          $premium = Get-Content $premiumUi -Raw
          $premium = $premium.Replace('tabs.Padding = Padding.Empty;', 'tabs.Padding = Point.Empty;')
          $premium = $premium.Replace('case Panel panel:',
            'case Panel panel when control is not TableLayoutPanel && control is not FlowLayoutPanel:')
          Set-Content $premiumUi -Value $premium -Encoding UTF8

          $portable = Get-Content $portableYara -Raw
          $portable = $portable.Replace(
            'new JsonSerializerOptions { PropertyNameCaseInsensitive = true }',
            'new JsonSerializerOptions { PropertyNameCaseInsensitive = true, PropertyNamingPolicy = JsonNamingPolicy.SnakeCaseLower }')
          $portable = $portable.Replace('Path.GetFileName(asset.Name)', 'Path.GetFileName(asset.Name!)')
          Set-Content $portableYara -Value $portable -Encoding UTF8

          $yara = Get-Content $yaraServices -Raw
          $old = @'
        string fullPath = Path.GetFullPath(target);
        if (!File.Exists(fullPath) && !Directory.Exists(fullPath)) throw new FileNotFoundException("Percorso non trovato.");
        if (_configuration.Exclusions.Any(x => fullPath.StartsWith(Path.GetFullPath(x), StringComparison.OrdinalIgnoreCase)))
            return Array.Empty<YaraScanResult>();
'@
          $new = @'
        string fullPath = Path.GetFullPath(target);
        if (!File.Exists(fullPath) && !Directory.Exists(fullPath)) throw new FileNotFoundException("Percorso non trovato.");
        FFGuardianScanExclusionService exclusions = FFGuardianScanExclusionService.Current;
        if (exclusions.ShouldExcludeFromNormalScan(fullPath))
        {
            _log($"YARA_EXCLUDED category={exclusions.GetCategory(fullPath, true)} reason=\"{exclusions.GetExclusionReason(fullPath)}\"");
            return Array.Empty<YaraScanResult>();
        }
        if (_configuration.Exclusions.Any(x => FFGuardianScanExclusionService.IsPathInsideDirectory(fullPath, x)))
            return Array.Empty<YaraScanResult>();
'@
          if (-not $yara.Contains($old)) { throw "Blocco YARA di esclusione atteso non trovato." }
          $yara = $yara.Replace($old, $new)
          Set-Content $yaraServices -Value $yara -Encoding UTF8

      - name: Verify centralized exclusion source contract
        shell: pwsh
        run: |
          $source = Get-Content "FFGuardian.App/Security/ScanExclusions30.cs" -Raw
          $required = @(
            'AppContext.BaseDirectory',
            'Environment.SpecialFolder.LocalApplicationData',
            'IsPathInsideDirectory',
            'ShouldExcludeFromNormalScan',
            'FFGuardianManifestVerifier',
            'SHA256.HashDataAsync',
            'InvalidSignature',
            'ContainsReparsePoint',
            'File non presente nel manifesto'
          )
          foreach ($item in $required) {
            if (-not $source.Contains($item)) { throw "Contratto esclusioni mancante: $item" }
          }

      - name: Restore exclusion contract tests
        shell: pwsh
        run: dotnet restore FFGuardian.ScanExclusion.Tests/FFGuardian.ScanExclusion.Tests.csproj

      - name: Run exclusion contract tests
        shell: pwsh
        run: dotnet run --project FFGuardian.ScanExclusion.Tests/FFGuardian.ScanExclusion.Tests.csproj --configuration Release --no-restore

      - name: Restore application project
        shell: pwsh
        run: dotnet restore FFGuardian.App/FFGuardian.App.csproj --runtime win-x64

      - name: Build Release x64
        shell: pwsh
        run: >-
          dotnet build FFGuardian.App/FFGuardian.App.csproj
          --configuration Release
          --runtime win-x64
          --no-restore
          /warnaserror
          /p:NoWarn=SYSLIB1045%3BSYSLIB1054

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: >-
          dotnet publish FFGuardian.App/FFGuardian.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/win-x64
          /p:NoWarn=SYSLIB1045%3BSYSLIB1054

      - name: Verify published executable
        shell: pwsh
        run: |
          $required = @(
            "artifacts/publish/win-x64/FFGuardian.exe",
            "artifacts/publish/win-x64/FFGuardian.dll",
            "artifacts/publish/win-x64/FFGuardian.runtimeconfig.json"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "File obbligatorio mancante: $file" }
          }

      - name: Write package information
        shell: pwsh
        run: |
          $info = @"
          FFGuardian Ultimate Protection — QA package
          Commit: $env:GITHUB_SHA
          Build UTC: $([DateTime]::UtcNow.ToString("yyyy-MM-dd HH:mm:ss"))
          Runtime: win-x64

          Esclusioni interne protette:
          - confronto sicuro con confini directory;
          - nessuna esclusione per semplice nome FFGuardian;
          - file sconosciuti nella directory installazione restano analizzabili;
          - quarantena, log, temp, update, backup, cache e report sono categorie operative;
          - file ufficiali installati richiedono processo/assembly caricato o manifesto firmato;
          - controllo integrità separato, senza eliminazione automatica.

          Test automatici eseguiti dal workflow: confini, traversal, spazi/caratteri speciali,
          file esterno omonimo, file sconosciuto interno, log e quarantena.
          I test runtime completi FileSystemWatcher/ClamAV/USB richiedono una VM Windows interattiva.
          "@
          Set-Content -Path "artifacts/publish/win-x64/BUILD-INFO.txt" -Value $info -Encoding UTF8

      - name: Create ZIP package
        shell: pwsh
        run: |
          $zip = "artifacts/FFGuardian-Ultimate-QA-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Set-Content -Path "artifacts/FFGuardian-Ultimate-QA-win-x64.sha256.txt" -Value "$hash  FFGuardian-Ultimate-QA-win-x64.zip" -Encoding ASCII

      - name: Upload downloadable package
        uses: actions/upload-artifact@v4
        with:
          name: FFGuardian-Ultimate-QA-win-x64
          path: |
            artifacts/FFGuardian-Ultimate-QA-win-x64.zip
            artifacts/FFGuardian-Ultimate-QA-win-x64.sha256.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
