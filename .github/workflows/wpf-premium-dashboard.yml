name: FFGuardian Premium WPF Dashboard

on:
  push:
    branches: [qa/full-stabilization-20260804]
  pull_request:
    branches: [engine10-definitive]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffguardian-premium-wpf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wpf:
    name: Build and render premium WPF dashboard
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Restore WPF frontend
        run: dotnet restore FFGuardian.PremiumWpf/FFGuardian.PremiumWpf.csproj --runtime win-x64
      - name: Build WPF Release
        run: dotnet build FFGuardian.PremiumWpf/FFGuardian.PremiumWpf.csproj --configuration Release --runtime win-x64 --no-restore /warnaserror
      - name: Publish WPF frontend
        run: dotnet publish FFGuardian.PremiumWpf/FFGuardian.PremiumWpf.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/premium-wpf
      - name: Verify bindings and executable
        shell: pwsh
        run: |
          $required = @(
            "artifacts/premium-wpf/FFGuardian.Premium.exe",
            "artifacts/premium-wpf/FFGuardian.Premium.dll",
            "artifacts/premium-wpf/FFGuardian.Premium.runtimeconfig.json"
          )
          foreach ($file in $required) { if (-not (Test-Path $file)) { throw "File mancante: $file" } }
          $xaml = Get-Content "FFGuardian.PremiumWpf/MainWindow.xaml" -Raw
          $bindings = @("SecurityScore", "ProtectionText", "Components", "Activities", "RefreshCommand", "ActionCommand", "NavigateCommand")
          foreach ($binding in $bindings) { if (-not $xaml.Contains("{Binding $binding")) { throw "Binding non trovato: $binding" } }
      - name: Generate dashboard design preview
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path artifacts/screenshots | Out-Null
          $path = Join-Path $PWD "artifacts/screenshots/FFGuardian-Premium-Dashboard.png"
          $bmp = New-Object System.Drawing.Bitmap 1440,860
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $bg = [System.Drawing.ColorTranslator]::FromHtml('#0B0F14')
          $side = [System.Drawing.ColorTranslator]::FromHtml('#10161D')
          $card = [System.Drawing.ColorTranslator]::FromHtml('#171E26')
          $hover = [System.Drawing.ColorTranslator]::FromHtml('#202A34')
          $accent = [System.Drawing.ColorTranslator]::FromHtml('#7CFF00')
          $muted = [System.Drawing.ColorTranslator]::FromHtml('#AAB4BE')
          $white = [System.Drawing.Color]::White
          $g.Clear($bg)
          $g.FillRectangle((New-Object System.Drawing.SolidBrush $side),0,0,240,860)
          $title = New-Object System.Drawing.Font 'Segoe UI',24,[System.Drawing.FontStyle]::Bold
          $h2 = New-Object System.Drawing.Font 'Segoe UI',18,[System.Drawing.FontStyle]::Bold
          $body = New-Object System.Drawing.Font 'Segoe UI',12
          $small = New-Object System.Drawing.Font 'Segoe UI',10
          $accentBrush = New-Object System.Drawing.SolidBrush $accent
          $whiteBrush = New-Object System.Drawing.SolidBrush $white
          $mutedBrush = New-Object System.Drawing.SolidBrush $muted
          $cardBrush = New-Object System.Drawing.SolidBrush $card
          $hoverBrush = New-Object System.Drawing.SolidBrush $hover
          $g.DrawString('FF GUARDIAN',$title,$accentBrush,22,22)
          $g.DrawString('ULTIMATE PROTECTION',$small,$mutedBrush,24,58)
          $nav = @('Dashboard','Scansione','Protezione','Firewall','Ransom Shield','USB Shield','Quarantena','Recupero File','Aggiornamenti','Audit','Attività','Salute PC','Assistenza','Impostazioni')
          $y = 102
          foreach ($item in $nav) { if ($item -eq 'Dashboard') { $g.FillRectangle($hoverBrush,10,$y-6,220,38) }; $g.DrawString($item,$body,($(if($item -eq 'Dashboard'){$accentBrush}else{$mutedBrush})),36,$y); $y += 43 }
          $g.DrawString('FFGuardian Ultimate Protection',$title,$whiteBrush,270,24)
          $g.DrawString('●  Attenzione',$body,$accentBrush,1190,32)
          $g.FillRectangle($cardBrush,270,88,1145,238)
          $pen = New-Object System.Drawing.Pen $accent,14
          $g.DrawArc($pen,305,118,170,170,-90,250)
          $scoreFont = New-Object System.Drawing.Font 'Segoe UI',44,[System.Drawing.FontStyle]::Bold
          $g.DrawString('67',$scoreFont,$whiteBrush,352,164)
          $g.DrawString('SICUREZZA /100',$small,$mutedBrush,342,230)
          $g.DrawString('STATO PROTEZIONE',$small,$mutedBrush,520,128)
          $protectFont = New-Object System.Drawing.Font 'Segoe UI',30,[System.Drawing.FontStyle]::Bold
          $g.DrawString('ATTENZIONE',$protectFont,$accentBrush,520,154)
          $g.DrawString('Uno o più componenti richiedono verifica runtime.',$body,$mutedBrush,520,202)
          $g.FillRectangle($accentBrush,520,246,176,42)
          $g.DrawString('Scansione Rapida',$body,(New-Object System.Drawing.SolidBrush $bg),534,256)
          $g.FillRectangle((New-Object System.Drawing.SolidBrush ([System.Drawing.ColorTranslator]::FromHtml('#111820'))),1090,112,290,188)
          $g.DrawString('Ultima scansione',$small,$mutedBrush,1110,130); $g.DrawString('Non disponibile',$body,$whiteBrush,1110,150)
          $g.DrawString('Versione motore',$small,$mutedBrush,1110,194); $g.DrawString('10.0.1',$body,$whiteBrush,1110,214)
          $actions = @('Scansione Rapida','Scansione Completa','Scansione Cartella','Verifica Integrità')
          $x = 270
          foreach ($action in $actions) { $g.FillRectangle($cardBrush,$x,346,273,150); $g.DrawString($action,$h2,$whiteBrush,$x+18,370); $g.DrawString('Azione di sicurezza',$small,$mutedBrush,$x+18,405); $g.FillRectangle($accentBrush,$x+18,440,110,34); $g.DrawString('Avvia',$small,(New-Object System.Drawing.SolidBrush $bg),$x+52,448); $x += 287 }
          $g.FillRectangle($cardBrush,270,516,690,310); $g.DrawString('MOTORE ANTIVIRUS',$h2,$whiteBrush,292,540)
          $components = @('Engine10','ClamAV','FreshClam','YARA','Database firme','Connettività aggiornamenti')
          $cy=580; foreach($component in $components){$g.DrawString($component,$body,$whiteBrush,292,$cy);$g.DrawString('●',$body,$accentBrush,910,$cy);$cy+=37}
          $g.FillRectangle($cardBrush,974,516,441,310); $g.DrawString('ATTIVITÀ RECENTI',$h2,$whiteBrush,996,540)
          $events=@('Stato aggiornato','Interfaccia premium avviata','Verifica componenti richiesta');$ey=584;foreach($event in $events){$g.DrawString($event,$body,$mutedBrush,996,$ey);$ey+=48}
          $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          if (-not (Test-Path $path)) { throw 'Anteprima Dashboard non generata.' }
      - name: Upload WPF dashboard package
        uses: actions/upload-artifact@v4
        with:
          name: FFGuardian-Premium-WPF-Dashboard
          path: |
            artifacts/premium-wpf/**
            artifacts/screenshots/FFGuardian-Premium-Dashboard.png
          if-no-files-found: error
          retention-days: 14
