name: Legacy FF GUARDIAN Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single EXE
        run: dotnet publish FFGuardian.App/FFGuardian.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Create ZIP
        shell: powershell
        run: Compress-Archive -Path publish/* -DestinationPath FF-GUARDIAN-LEGACY-WINDOWS.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: FF-GUARDIAN-LEGACY-WINDOWS
          path: FF-GUARDIAN-LEGACY-WINDOWS.zip
          retention-days: 7
